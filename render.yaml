# Render Blueprint for the AI Company Research Assistant backend.
#
# This is a monorepo (backend/ + frontend/), so `rootDir` tells Render
# where to find requirements.txt and run build/start commands from —
# without it, Render's auto-detection looks at the repo root and fails
# to find a Python project.
#
# Deploy: https://dashboard.render.com/blueprints -> "New Blueprint
# Instance" -> select this repository. Render reads this file
# automatically; no manual service configuration needed.
#
# See docs/ARCHITECTURE.md and docs/ROADMAP.md for backend context.

services:
  - type: web
    name: company-research-assistant-backend
    runtime: python
    plan: free
    branch: main
    rootDir: backend
    # `playwright install chromium` is required in addition to `pip
    # install` — Crawl4AI drives a real headless browser, and the pip
    # package alone doesn't include the browser binary. (Deliberately not
    # `--with-deps`, which shells out to apt-get and needs root — Render's
    # native Python build environment doesn't have that, and a failing
    # apt-get would fail the whole build. If the sandboxed browser is
    # still missing system shared libraries at runtime, CrawlerService
    # catches that and the research pipeline degrades gracefully instead
    # of crashing — see app/crawler/crawl4ai_client.py.)
    buildCommand: pip install -r requirements.txt && playwright install chromium
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      # Kept in sync with the code default in app/core/config.py — this
      # explicit declaration is belt-and-suspenders so the allowed origin
      # list is visible/editable from the Render dashboard without a
      # code change, in case the frontend's deploy URL ever changes.
      - key: CORS_ALLOWED_ORIGINS
        value: '["http://localhost:5173","https://ai-poweredresearchautomation-platform.netlify.app"]'
      # Secrets — not stored in this file. Render will prompt for these
      # when the Blueprint is created; set them in the service's
      # Environment tab afterward. See backend/.env.example for the full
      # variable list and what each one does.
      - key: SERPER_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
