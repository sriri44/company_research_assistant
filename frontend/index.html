<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI Company Research Assistant — instant AI-powered company research, competitor analysis, and growth opportunities." />
    <meta name="color-scheme" content="light dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>AI Company Research Assistant</title>
    <script>
      // Applied before paint to avoid a light-mode flash for users whose
      // persisted/system preference is dark — the same resolution logic
      // used by useThemeStore just runs a moment earlier here.
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem("research-assistant-theme") || "null");
          var theme = stored && stored.state ? stored.state.theme : "system";
          var isDark =
            theme === "dark" ||
            (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", isDark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
